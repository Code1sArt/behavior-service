name: Deploy to Plesk

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        type: choice
        options: [deploy, inspect]
        default: deploy

concurrency:
  group: plesk-production
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PLESK_SSH_KEY" > ~/.ssh/plesk_deploy_key
          chmod 600 ~/.ssh/plesk_deploy_key
          ssh-keyscan -p "${{ secrets.PLESK_PORT || '22' }}" "${{ secrets.PLESK_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect production without changing it
        run: |
          ssh -i ~/.ssh/plesk_deploy_key -p "${{ secrets.PLESK_PORT || '22' }}" \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "cd '${{ secrets.PLESK_DEPLOY_PATH }}' && /opt/plesk/node/24/bin/node - inspect" \
            < scripts/photography-production.cjs
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'inspect'
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      restore-check:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: restore-verification-only
          MARIADB_DATABASE: restore_check
        ports:
          - 33316:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PLESK_PORT: ${{ secrets.PLESK_PORT || '22' }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Test
        run: yarn test --runInBand

      - name: Build
        run: yarn build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/plesk_deploy_key
          chmod 600 ~/.ssh/plesk_deploy_key
          ssh-keyscan -p "$PLESK_PORT" "${{ secrets.PLESK_HOST }}" >> ~/.ssh/known_hosts

      - name: Snapshot production before changing source or schema
        run: |
          ssh -i ~/.ssh/plesk_deploy_key -p "$PLESK_PORT" \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "cd '${{ secrets.PLESK_DEPLOY_PATH }}' && /opt/plesk/node/24/bin/node - backup '${GITHUB_RUN_ID}'" \
            < scripts/photography-production.cjs

      - name: Verify snapshot restoration in a disposable database
        env:
          MYSQL_PWD: restore-verification-only
        run: |
          set -euo pipefail
          umask 077
          SNAPSHOT_FILE="$RUNNER_TEMP/production-restore-check.sql.gz"
          trap 'rm -f "$SNAPSHOT_FILE"' EXIT
          ssh -i ~/.ssh/plesk_deploy_key -p "$PLESK_PORT" \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "cd '${{ secrets.PLESK_DEPLOY_PATH }}' && /opt/plesk/node/24/bin/node - export '${GITHUB_RUN_ID}'" \
            < scripts/photography-production.cjs > "$SNAPSHOT_FILE"
          gzip -t "$SNAPSHOT_FILE"
          DB_CONTAINER="${{ job.services.restore-check.id }}"
          gzip -dc "$SNAPSHOT_FILE" | docker exec -i -e MYSQL_PWD "$DB_CONTAINER" mariadb -uroot restore_check
          docker exec -e MYSQL_PWD "$DB_CONTAINER" mariadb-check -uroot restore_check
          docker exec -e MYSQL_PWD "$DB_CONTAINER" mariadb -uroot restore_check \
            -e 'SELECT COUNT(*) AS restored_users FROM User; SELECT COUNT(*) AS applied_migrations FROM _prisma_migrations WHERE finished_at IS NOT NULL;'
          ssh -i ~/.ssh/plesk_deploy_key -p "$PLESK_PORT" \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "cd '${{ secrets.PLESK_DEPLOY_PATH }}' && /opt/plesk/node/24/bin/node - verified '${GITHUB_RUN_ID}'" \
            < scripts/photography-production.cjs

      - name: Upload source to Plesk
        run: |
          rsync -az --delete \
            --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/plesk_deploy_key -p $PLESK_PORT" \
            ./ "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}:${{ secrets.PLESK_DEPLOY_PATH }}/"

      - name: Run remote deploy
        id: release
        run: |
          ssh -i ~/.ssh/plesk_deploy_key -p "$PLESK_PORT" \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "cd '${{ secrets.PLESK_DEPLOY_PATH }}' && PHOTOGRAPHY_RELEASE_ID='${GITHUB_RUN_ID}' bash scripts/plesk-deploy.sh"

      - name: Health check
        id: health
        if: ${{ env.HEALTHCHECK_URL != '' }}
        run: |
          BASE_URL="${HEALTHCHECK_URL%/}"
          BASE_URL="${BASE_URL%/docs}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$BASE_URL/health"

      - name: Verify production photography permissions
        id: smoke
        run: |
          ssh -i ~/.ssh/plesk_deploy_key -p "$PLESK_PORT" \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "cd '${{ secrets.PLESK_DEPLOY_PATH }}' && /opt/plesk/node/24/bin/node - smoke" \
            < scripts/photography-production.cjs

      - name: Restore previous API if release verification fails
        if: failure() && (steps.release.outcome == 'failure' || steps.health.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          ssh -i ~/.ssh/plesk_deploy_key -p "$PLESK_PORT" \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "cd '${{ secrets.PLESK_DEPLOY_PATH }}' && /opt/plesk/node/24/bin/node - rollback '${GITHUB_RUN_ID}'" \
            < scripts/photography-production.cjs
